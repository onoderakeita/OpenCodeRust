# 個人リポジトリ共通の再利用可能ワークフロー
# （onoderakeita/workflows の rust-gates.yml）へ委譲する。
# native-tls（reqwest / oauth2 経由）のビルド用に libssl-dev を導入する。
# 依存監査（cargo audit）も有効化する。ignore は .cargo/audit.toml。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: onoderakeita/workflows/.github/workflows/rust-gates.yml@v1
    with:
      apt_packages: |
        libssl-dev
      audit: true
